server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 charset utf-8;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self' https://xmsdqrmsvmxqnikcivhv.supabase.co wss://xmsdqrmsvmxqnikcivhv.supabase.co; object-src 'self' blob: https://xmsdqrmsvmxqnikcivhv.supabase.co; frame-src 'none'; worker-src 'self' blob:; media-src 'self' blob: https://xmsdqrmsvmxqnikcivhv.supabase.co; upgrade-insecure-requests" always;
 # Revalidate every asset: a saved old page must not silently mix incompatible versions.
 add_header Cache-Control "no-cache" always;
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { try_files $uri =404; }
 location ~ /\. { deny all; }
}
